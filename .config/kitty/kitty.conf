include /home/sam/.cache/wal/colors-kitty.conf

font_family      JetBrainsMono Nerd Font
font_size        12

# --- TRANSPARENCY ---
# Background opacity (0.0 is invisible, 1.0 is solid)
# 0.8 is a good starting point for a nice see-through effect
background_opacity 0.6
cursor_trail 1
#cursor_trail_decay 0.1 0.4
cursor_trail_color #cba6f7
#term xterm-256color

# Optional: Dim inactive windows slightly more
dim_inactive 0.75

# Ensure the background color is set to allow transparency
# (Most themes do this automatically, but this ensures it)
dynamic_background_opacity yes

# When kitty is not focused, it gets darker/more transparent
inactive_text_alpha 0.7

hide_window_decorations titlebar-only

# BEGIN_KITTY_THEME
#Catppuccin-Mocha
#include current-theme.conf
# END_KITTY_THEME

# quick search with ctrl+f  change the --type with overlay to open finder in overlay and chnage it to tab to open in seperate tab
map ctrl+f launch --stdin-source=none --type=tab sh -c 'file=$(fzf --preview "bat --color=always --style=numbers --line-range=:300 {}" --bind "ctrl-/:toggle-preview" --header="Ctrl+/: Toggle Preview"); [ -n "$file" ] && ${EDITOR:-nvim} "$file"'
