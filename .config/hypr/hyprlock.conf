$font = JetBrainsMono Nerd Font Propo
source= mocha.conf

general {
    hide_cursor = false
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor = 
    path = ~/WALLPAPERS/wallhaven-og5165.jpg
    blur_passes = 1
    blur_size = 3
}
# Profile Picture
image {
    monitor =
    path = ~/.config/hypr/hyprlock-profiles/john-marston.jpg
    size = 100
    rounding = -1
    border_size = 2
    border_color = rgba(255, 255, 255, 0.10)
    position = 0, 260
    halign = center
    valign = bottom
}


#user
label {
    monitor =
    # text = cmd[update:1000] whoami
    text = cmd[update:60000] echo "$USER" | tr '[:lower:]' '[:upper:]'
    font_family = Arial
    color = rgba(255, 255, 255, 0.5)
    position = 0, 220
    halign = center
    valign = bottom
}

input-field {
    monitor =
    size = 200, 30
    outline_thickness = 2
    inner_color = rgba(255, 255, 255, 0.08)
    outer_color = rgba(255, 255, 255, 0.10)
    check_color = $red
    fail_color = $red

    font_color = rgba(255, 255, 255, 0.20)
    fade_on_empty = false
    rounding = 15

    font_family = $font
    placeholder_text =
    fail_text =

    dots_size = 0.4
    dots_spacing = 0.3

    position = 0, 180
    halign = center
    valign = bottom
}

# TIME
label {
    monitor =
    text = cmd[update:1]  date +"%l:%M"
    font_size = 120
    font_family = $font black
    position = 0, -200
    halign = center
    valign = top
    color = rgba($textAlpha55)
}

# day
label {
    monitor =
    text = cmd[update:1] date +"%a"
    font_size = 16
    font_family = $font
    position = -150, -380
    halign = center
    valign = top
    color = $text
}

#separator
label {
    monitor =
    text = 
    font_size = 14
    font_family = $font
    position = -100, -382
    halign = center
    valign = top
    color=$red
}

# date
label {
    monitor =
    text = cmd[update:1] date +"%e"
    font_size = 16
    font_family = $font
    position = -50, -380
    halign = center
    valign = top
    color = $text
}
#separator
label {
    monitor =
    text = 
    font_size = 14
    font_family = $font
    position = 0, -382
    halign = center
    valign = top
    color=$green
}

# month
label {
    monitor =
    text = cmd[update:1] date +"%b"
    font_size = 16
    font_family = $font
    position = 50, -380
    halign = center
    valign = top
    color = $text
}
#separator
label {
    monitor =
    text = 
    font_size = 14
    font_family = $font
    position = 100, -382
    halign = center
    valign = top
    color=$blue
}
# Year
label {
    monitor =
    text = cmd[update:1] date +"%Y"
    font_size = 16
    font_family = $font
    position = 150, -380
    halign = center
    valign = top
    color = $text
}
