[opener]
edit = [
    { run = 'nvim %s', block = true, desc = "Neovim" },
    { run = 'nano %s', block = true, desc = "Nano" },
    { run = 'code %s', desc = "VSCode" },
    { run = 'gnome-text-editor %s', desc = "GNOME Text Editor" },
]

[open]
prepend_rules = [
    { mime = "text/*", use = ["edit"] },
    { mime = "application/json", use = ["edit"] },
]

[mgr]
show_hidden = true
sort_by = "btime"
sort_reverse = true   # true = newest first
